<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Открытие Карт — WFC Style</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1b2a;
            color: #1b263b;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
        }

        .top-bar {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
        }

        .wallet-container {
            background: #1e293b;
            color: #f59e0b;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 16px;
            border: 2px solid #f59e0b;
            box-shadow: 0 4px 10px rgba(245, 158, 11, 0.2);
        }

        .btn-shop-open {
            background: #f59e0b;
            color: #0d1b2a;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.2s, background 0.2s;
        }

        .btn-shop-open:hover {
            background: #d97706;
            transform: translateY(-2px);
        }

        .chances-list {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            font-size: 13px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .chance-item {
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            background: #152238;
            color: #ffffff;
            border: 1px solid #2e4057;
        }

        .pack-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .card-container {
            width: 190px;
            height: 270px;
            perspective: 1000px;
            margin-bottom: 20px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 14px;
            cursor: pointer;
        }

        .card.shake {
            animation: packShake 0.4s ease-in-out;
        }

        @keyframes packShake {
            0% { transform: scale(1) rotate(0deg); }
            20% { transform: scale(1.05) rotate(-3deg); }
            40% { transform: scale(1.05) rotate(3deg); }
            60% { transform: scale(1.05) rotate(-3deg); }
            80% { transform: scale(1.05) rotate(3deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .card.flipped {
            transform: rotateY(180deg) scale(1.03);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 3px solid #1e293b;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .card-back {
            background: #111827;
            border-color: #9f1239;
            font-size: 32px;
            font-weight: 900;
            color: #ffffff;
        }

        .card-back::after {
            content: "WFC";
            font-size: 14px;
            letter-spacing: 3px;
            color: #9f1239;
            margin-top: 5px;
        }

        .card-front {
            transform: rotateY(180deg);
            padding: 12px;
            text-align: center;
            background: #ffffff;
        }

        /* Зображення всередині картки */
        .card-img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            display: none;
        }

        .card-name {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 6px;
            color: #0f172a;
        }

        .card-rarity {
            font-size: 11px;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .btn-open, .btn-upgrade {
            background: #9f1239;
            color: #ffffff;
            border: 2px solid #881337;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-open:hover:not(:disabled), .btn-upgrade:hover:not(:disabled) {
            background: #be123c;
            transform: translateY(-2px);
        }

        .btn-open:disabled, .btn-upgrade:disabled {
            background: #334155;
            border-color: #475569;
            color: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active { display: flex; }

        .shop-modal {
            background: #ffffff;
            width: 90%;
            max-width: 500px;
            padding: 24px;
            border-radius: 14px;
            border: 3px solid #1e293b;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .shop-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .shop-modal-header h2 {
            font-size: 20px;
            color: #0f172a;
            font-weight: 800;
            text-transform: uppercase;
        }

        .btn-close-modal {
            background: transparent;
            border: none;
            font-size: 24px;
            font-weight: bold;
            color: #64748b;
            cursor: pointer;
        }

        .upgrades-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .upgrade-card {
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .upgrade-title { font-weight: 700; font-size: 14px; color: #0f172a; }
        .upgrade-desc { font-size: 12px; color: #64748b; }

        .collection-section {
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            padding: 24px;
            border-radius: 14px;
            border: 3px solid #1e293b;
        }

        .collection-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .collection-section h2 {
            font-size: 20px;
            color: #0f172a;
            font-weight: 800;
            text-transform: uppercase;
        }

        .progress-wrapper {
            margin-bottom: 18px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 6px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: #e2e8f0;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: #9f1239;
            transition: width 0.4s ease;
        }

        .btn-reset {
            background: transparent;
            border: 1px solid #cbd5e1;
            color: #64748b;
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-reset:hover { background: #f1f5f9; color: #0f172a; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
        }

        .collection-card {
            background: #f8fafc;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid #cbd5e1;
            opacity: 0.35;
            transition: opacity 0.3s, border-color 0.3s;
        }

        .collection-card.unlocked {
            opacity: 1;
            background: #ffffff;
        }

        .collection-card .col-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            margin: 6px 0;
            display: none;
        }

        .collection-card .name {
            font-size: 13px;
            font-weight: 700;
            margin-top: 4px;
            color: #0f172a;
            text-align: center;
        }

        .collection-card .count {
            font-size: 11px;
            color: #64748b;
            margin-top: 2px;
            font-weight: 600;
        }

        /* Стилі Рідкісностей */
        .COMMON { border-color: #64748b; }
        .COMMON .card-rarity, .chance-item.COMMON { background: #e2e8f0; color: #334155; }

        .RARE { border-color: #1d4ed8; }
        .RARE .card-rarity, .chance-item.RARE { background: #1d4ed8; color: #ffffff; }

        .EPIC { border-color: #9f1239; }
        .EPIC .card-rarity, .chance-item.EPIC { background: #9f1239; color: #ffffff; }

        .LEGENDARY { border-color: #d97706; }
        .LEGENDARY .card-rarity, .chance-item.LEGENDARY { background: #d97706; color: #ffffff; }

        .MYTHIC { border-color: #a855f7; }
        .MYTHIC .card-rarity, .chance-item.MYTHIC { background: #a855f7; color: #ffffff; }

        /* Фоновий дизайн карт для високих рідкісностей */
        .card-front.COMMON { border-color: #94a3b8; }
        .card-front.RARE { border-color: #1d4ed8; }
        .card-front.EPIC { border-color: #9f1239; }
        .card-front.LEGENDARY { 
            border-color: #d97706; 
            background: linear-gradient(135deg, #fffbe3 0%, #fef3c7 100%);
        }
        .card-front.MYTHIC { 
            border-color: #a855f7; 
            background: linear-gradient(135deg, #fae8ff 0%, #f3e8ff 100%);
            color: #581c87;
        }
    </style>
</head>
<body>

    <h1>Открытие Карт</h1>

    <div class="top-bar">
        <div class="wallet-container">
            Баланс: <span id="coinsCount">0</span> WFC
        </div>
        <button class="btn-shop-open" onclick="toggleShop(true)">Магазин 🛒</button>
    </div>

    <div class="chances-list" id="chancesDisplay"></div>

    <div class="pack-section">
        <div class="card-container">
            <div class="card" id="mainCard">
                <div class="card-back">W</div>
                <div class="card-front" id="cardFront">
                    <img id="cardImage" class="card-img" src="" alt="Card Graphic">
                    <div class="card-name" id="cardName">-</div>
                    <div class="card-rarity" id="cardRarity">-</div>
                </div>
            </div>
        </div>
        <button class="btn-open" id="openBtn" onclick="openPack()">Открыть Карту</button>
    </div>

    <!-- Модальне вікно Магазину -->
    <div class="modal-overlay" id="shopModal">
        <div class="shop-modal">
            <div class="shop-modal-header">
                <h2>Магазин Прокачки</h2>
                <button class="btn-close-modal" onclick="toggleShop(false)">&times;</button>
            </div>
            <div class="upgrades-grid">
                <div class="upgrade-card">
                    <div>
                        <div class="upgrade-title">Быстрая Перезарядка</div>
                        <div class="upgrade-desc" id="cdUpgradeDesc">Уменьшает КД открытия карт.</div>
                    </div>
                    <button class="btn-upgrade" id="btnUpgradeCD" onclick="buyCDUpgrade()"></button>
                </div>
                <div class="upgrade-card">
                    <div>
                        <div class="upgrade-title">Удача (+1)</div>
                        <div class="upgrade-desc">Повышает шанс RARE, EPIC, LEGENDARY и MYTHIC.</div>
                    </div>
                    <button class="btn-upgrade" id="btnUpgradeLuck" onclick="buyLuckUpgrade()"></button>
                </div>
            </div>
        </div>
    </div>

    <div class="collection-section">
        <div class="collection-header">
            <h2>Твоя Коллекция</h2>
            <button class="btn-reset" onclick="resetProgress()">Сбросить прогресс</button>
        </div>
        
        <div class="progress-wrapper">
            <div class="progress-info">
                <span>Прогресс сбора:</span>
                <span id="progressText">0% (0/0)</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <div class="grid" id="collectionGrid"></div>
    </div>

    <script>
        // Вкажіть тут посилання на свої зображення (URL або шлях до локального файлу, напр. "images/dundik.png")
        const cardsData = [
            { name: "Henedi", rarity: "COMMON" },
            { name: "DGYJura", rarity: "RARE" },
            { name: "Zeta", rarity: "RARE" },
            { name: "Niksi", rarity: "RARE" },
            { name: "Levante", rarity: "RARE" },
            { name: "Flou", rarity: "EPIC" },
            { name: "Morro", rarity: "EPIC" },
            { name: "Ibra", rarity: "EPIC" },
            { name: "Dundik", rarity: "LEGENDARY", image: "https://via.placeholder.com/100/d97706/ffffff?text=Dundik" },
            { name: "Опера", rarity: "LEGENDARY", image: "https://via.placeholder.com/100/d97706/ffffff?text=Opera" },
            { name: "Dundik Prime", rarity: "MYTHIC", image: "dundik_prime.png" }
        ];

        let collection = JSON.parse(localStorage.getItem('wfc_card_collection')) || {};
        let coins = parseInt(localStorage.getItem('wfc_coins')) || 0;
        let cdLevel = parseInt(localStorage.getItem('wfc_cd_level')) || 0;
        let luckLevel = parseInt(localStorage.getItem('wfc_luck_level')) || 0;

        cardsData.forEach(card => {
            if (collection[card.name] === undefined) {
                collection[card.name] = 0;
            }
        });

        function saveData() {
            localStorage.setItem('wfc_card_collection', JSON.stringify(collection));
            localStorage.setItem('wfc_coins', coins);
            localStorage.setItem('wfc_cd_level', cdLevel);
            localStorage.setItem('wfc_luck_level', luckLevel);
        }

        function toggleShop(show) {
            const modal = document.getElementById('shopModal');
            if (show) {
                modal.classList.add('active');
            } else {
                modal.classList.remove('active');
            }
        }

        function getCooldownTime() {
            if (cdLevel === 0) return 5;
            if (cdLevel === 1) return 4;
            return 3;
        }

        function getChances() {
            let common = Math.max(5, 54 - (luckLevel * 3));
            let rare = 30 + (luckLevel * 1.5);
            let epic = 12 + (luckLevel * 1);
            let legendary = 3 + (luckLevel * 0.4);
            let mythic = 1 + (luckLevel * 0.1);

            return { COMMON: common, RARE: rare, EPIC: epic, LEGENDARY: legendary, MYTHIC: mythic };
        }

        function updateChancesUI() {
            const chances = getChances();
            const chancesDiv = document.getElementById('chancesDisplay');
            chancesDiv.innerHTML = `
                <div class="chance-item COMMON">COMMON: ${chances.COMMON.toFixed(1)}%</div>
                <div class="chance-item RARE">RARE: ${chances.RARE.toFixed(1)}%</div>
                <div class="chance-item EPIC">EPIC: ${chances.EPIC.toFixed(1)}%</div>
                <div class="chance-item LEGENDARY">LEGENDARY: ${chances.LEGENDARY.toFixed(1)}%</div>
                <div class="chance-item MYTHIC">MYTHIC: ${chances.MYTHIC.toFixed(1)}%</div>
            `;
        }

        function updateUI() {
            document.getElementById('coinsCount').innerText = coins;

            const btnCD = document.getElementById('btnUpgradeCD');
            const descCD = document.getElementById('cdUpgradeDesc');
            if (cdLevel === 0) {
                descCD.innerText = "Уменьшить КД с 5 сек до 4 сек";
                btnCD.innerText = "30 WFC";
                btnCD.disabled = coins < 30;
            } else if (cdLevel === 1) {
                descCD.innerText = "Уменьшить КД с 4 сек до 3 сек";
                btnCD.innerText = "50 WFC";
                btnCD.disabled = coins < 50;
            } else {
                descCD.innerText = "Максимальный уровень КД (3 сек)";
                btnCD.innerText = "МАКС.";
                btnCD.disabled = true;
            }

            const btnLuck = document.getElementById('btnUpgradeLuck');
            btnLuck.innerText = "50 WFC";
            btnLuck.disabled = coins < 50;

            updateChancesUI();
            updateProgress();
        }

        function buyCDUpgrade() {
            if (cdLevel === 0 && coins >= 30) {
                coins -= 30;
                cdLevel = 1;
            } else if (cdLevel === 1 && coins >= 50) {
                coins -= 50;
                cdLevel = 2;
            }
            saveData();
            updateUI();
        }

        function buyLuckUpgrade() {
            if (coins >= 50) {
                coins -= 50;
                luckLevel += 1;
                saveData();
                updateUI();
            }
        }

        function updateProgress() {
            const totalCards = cardsData.length;
            const unlockedCount = cardsData.filter(c => collection[c.name] > 0).length;
            const percentage = Math.round((unlockedCount / totalCards) * 100);

            document.getElementById('progressText').innerText = `${percentage}% (${unlockedCount}/${totalCards})`;
            document.getElementById('progressBar').style.width = `${percentage}%`;
        }

        function initCollection() {
            const grid = document.getElementById('collectionGrid');
            grid.innerHTML = '';
            
            cardsData.forEach(card => {
                const item = document.createElement('div');
                item.className = `collection-card ${card.rarity} ${collection[card.name] > 0 ? 'unlocked' : ''}`;
                item.id = `col-${card.name}`;
                
                let imgHtml = card.image ? `<img src="${card.image}" class="col-img" style="display:block;">` : '';

                item.innerHTML = `
                    <span class="card-rarity">${card.rarity}</span>
                    ${imgHtml}
                    <span class="name">${card.name}</span>
                    <span class="count" id="count-${card.name}">x${collection[card.name]}</span>
                `;
                grid.appendChild(item);
            });

            updateUI();
        }

        function getRandomRarity() {
            const chances = getChances();
            const rand = Math.random() * 100;

            if (rand < chances.COMMON) return "COMMON";
            if (rand < chances.COMMON + chances.RARE) return "RARE";
            if (rand < chances.COMMON + chances.RARE + chances.EPIC) return "EPIC";
            if (rand < chances.COMMON + chances.RARE + chances.EPIC + chances.LEGENDARY) return "LEGENDARY";
            return "MYTHIC";
        }

        let isOpening = false;

        function openPack() {
            if (isOpening) return;
            isOpening = true;

            const btn = document.getElementById('openBtn');
            const card = document.getElementById('mainCard');
            const cardFront = document.getElementById('cardFront');
            const cardName = document.getElementById('cardName');
            const cardRarity = document.getElementById('cardRarity');
            const cardImg = document.getElementById('cardImage');

            btn.disabled = true;

            if (card.classList.contains('flipped')) {
                card.classList.remove('flipped');
                setTimeout(startPackAnimation, 300);
            } else {
                startPackAnimation();
            }

            function startPackAnimation() {
                card.classList.add('shake');
                
                setTimeout(() => {
                    card.classList.remove('shake');
                    processDrop();
                }, 400);
            }

            function processDrop() {
                const rolledRarity = getRandomRarity();
                const availableCards = cardsData.filter(c => c.rarity === rolledRarity);
                const droppedCard = availableCards[Math.floor(Math.random() * availableCards.length)];

                cardFront.className = `card-front ${droppedCard.rarity}`;
                cardName.innerText = droppedCard.name;
                cardRarity.innerText = droppedCard.rarity;

                if (droppedCard.image) {
                    cardImg.src = droppedCard.image;
                    cardImg.style.display = "block";
                } else {
                    cardImg.style.display = "none";
                }

                card.classList.add('flipped');

                collection[droppedCard.name]++;
                coins += 1;
                
                saveData();
                updateCollectionUI(droppedCard.name);
                updateUI();

                startCooldown(getCooldownTime());
            }
        }

        function startCooldown(seconds) {
            const btn = document.getElementById('openBtn');
            let timeLeft = seconds;

            btn.disabled = true;
            btn.innerText = `Подождите (${timeLeft}с)`;

            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    btn.innerText = `Подождите (${timeLeft}с)`;
                } else {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.innerText = "Открыть Карту";
                    isOpening = false;
                }
            }, 1000);
        }

        function updateCollectionUI(name) {
            const colItem = document.getElementById(`col-${name}`);
            const countLabel = document.getElementById(`count-${name}`);
            
            if (collection[name] > 0) {
                colItem.classList.add('unlocked');
            }
            countLabel.innerText = `x${collection[name]}`;
        }

        function resetProgress() {
            if (confirm("Точно сбросить всю коллекцию, баланс и прокачку?")) {
                cardsData.forEach(card => collection[card.name] = 0);
                coins = 0;
                cdLevel = 0;
                luckLevel = 0;
                saveData();
                initCollection();
            }
        }

        initCollection();
    </script>
</body>
</html>
